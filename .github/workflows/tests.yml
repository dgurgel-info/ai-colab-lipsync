name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: python -m pytest -q tests
      - name: Worker compatível com Python 3.10 (o venv do InfiniteTalk)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compilar o worker e o download no Python 3.10
        run: python -m py_compile lipsync_studio/engine/__init__.py lipsync_studio/engine/worker.py lipsync_studio/engine/download.py
